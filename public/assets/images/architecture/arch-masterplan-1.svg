<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="planBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E26"/>
      <stop offset="100%" stop-color="#233544"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#planBg)"/>

  <!-- Axonometric Master Plan Grid -->
  <!-- Arterial Boulevard Roads -->
  <line x1="80" y1="440" x2="720" y2="100" stroke="#334155" stroke-width="22"/>
  <line x1="80" y1="440" x2="720" y2="100" stroke="#F8FAFC" stroke-width="1.5" stroke-dasharray="12 8"/>

  <line x1="180" y1="80" x2="620" y2="440" stroke="#334155" stroke-width="16"/>
  <line x1="180" y1="80" x2="620" y2="440" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Ecological Central Water Body & Lake Park -->
  <path d="M380,260 Q460,200 520,240 Q580,300 480,340 Q380,340 380,260 Z" fill="url(#lakeGrad)" opacity="0.85"/>
  <path d="M370,250 Q460,190 530,230 Q600,300 480,355 Q370,350 370,250 Z" fill="none" stroke="#497E5E" stroke-width="14" opacity="0.4"/>

  <!-- Isometric Building Footprints (Color coded by land use) -->
  <!-- Commercial District (Blue) -->
  <polygon points="220,180 270,150 330,180 280,210" fill="#38BDF8"/>
  <polygon points="280,210 330,180 330,220 280,250" fill="#0284C7"/>
  <polygon points="220,180 280,210 280,250 220,220" fill="#0369A1"/>

  <polygon points="300,130 350,100 410,130 360,160" fill="#38BDF8"/>
  <polygon points="360,160 410,130 410,180 360,210" fill="#0284C7"/>
  <polygon points="300,130 360,160 360,210 300,180" fill="#0369A1"/>

  <!-- Residential Parcels (Green) -->
  <polygon points="140,280 180,260 230,280 190,300" fill="#86EFAC"/>
  <polygon points="190,300 230,280 230,310 190,330" fill="#22C55E"/>
  <polygon points="140,280 190,300 190,330 140,310" fill="#15803D"/>

  <polygon points="200,320 240,300 290,320 250,340" fill="#86EFAC"/>
  <polygon points="250,340 290,320 290,350 250,370" fill="#22C55E"/>
  <polygon points="200,320 250,340 250,370 200,350" fill="#15803D"/>

  <!-- Civic & Institutional Hub (Orange) -->
  <polygon points="560,160 620,130 680,160 620,190" fill="#FCD34D"/>
  <polygon points="620,190 680,160 680,200 620,230" fill="#F59E0B"/>
  <polygon points="560,160 620,190 620,230 560,200" fill="#B45309"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#497E5E"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#497E5E" letter-spacing="1">URBAN MASTER PLAN</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">MIXED-USE DISTRICT</text>
</svg>
