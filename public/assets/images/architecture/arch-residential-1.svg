<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A38"/>
      <stop offset="100%" stop-color="#35556B"/>
    </linearGradient>
    <linearGradient id="towerGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="towerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#497E5E"/>
      <stop offset="100%" stop-color="#2D4D3A"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Sky Background with CAD Drafting Grid -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <rect width="800" height="500" fill="url(#gridPattern)"/>

  <!-- Technical Axis and CAD Elevation Lines -->
  <line x1="40" y1="420" x2="760" y2="420" stroke="#497E5E" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="45" y="412" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8" letter-spacing="1.5">EL +0.00m (BASE DATUM)</text>
  <text x="700" y="70" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8" letter-spacing="1.5">LVL +84.50m</text>
  <line x1="680" y1="75" x2="760" y2="75" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Background Silhouette Towers -->
  <rect x="120" y="140" width="90" height="280" fill="#243444" opacity="0.6"/>
  <rect x="580" y="120" width="100" height="300" fill="#243444" opacity="0.6"/>

  <!-- Tower 1: Primary Residential Block (Left/Center) -->
  <rect x="230" y="60" width="160" height="360" fill="url(#towerGrad1)"/>
  
  <!-- Tower 1 Architectural Balconies & Glass Bands -->
  <!-- Level 10 to Level 1 -->
  <g fill="url(#glassGrad)">
    <rect x="245" y="80" width="60" height="18" rx="1"/>
    <rect x="315" y="80" width="60" height="18" rx="1"/>
    <rect x="245" y="110" width="60" height="18" rx="1"/>
    <rect x="315" y="110" width="60" height="18" rx="1"/>
    <rect x="245" y="140" width="60" height="18" rx="1"/>
    <rect x="315" y="140" width="60" height="18" rx="1"/>
    <rect x="245" y="170" width="60" height="18" rx="1"/>
    <rect x="315" y="170" width="60" height="18" rx="1"/>
    <rect x="245" y="200" width="60" height="18" rx="1"/>
    <rect x="315" y="200" width="60" height="18" rx="1"/>
    <rect x="245" y="230" width="60" height="18" rx="1"/>
    <rect x="315" y="230" width="60" height="18" rx="1"/>
    <rect x="245" y="260" width="60" height="18" rx="1"/>
    <rect x="315" y="260" width="60" height="18" rx="1"/>
    <rect x="245" y="290" width="60" height="18" rx="1"/>
    <rect x="315" y="290" width="60" height="18" rx="1"/>
    <rect x="245" y="320" width="60" height="18" rx="1"/>
    <rect x="315" y="320" width="60" height="18" rx="1"/>
    <rect x="245" y="350" width="60" height="18" rx="1"/>
    <rect x="315" y="350" width="60" height="18" rx="1"/>
  </g>

  <!-- Tower 1 Vertical Architectural Fins -->
  <line x1="230" y1="60" x2="230" y2="420" stroke="#35556B" stroke-width="4"/>
  <line x1="310" y1="60" x2="310" y2="420" stroke="#35556B" stroke-width="3"/>
  <line x1="390" y1="60" x2="390" y2="420" stroke="#35556B" stroke-width="4"/>
  
  <!-- Crown Pergola on Tower 1 -->
  <rect x="225" y="48" width="170" height="12" fill="#35556B"/>
  <line x1="240" y1="42" x2="240" y2="48" stroke="#35556B" stroke-width="3"/>
  <line x1="270" y1="42" x2="270" y2="48" stroke="#35556B" stroke-width="3"/>
  <line x1="300" y1="42" x2="300" y2="48" stroke="#35556B" stroke-width="3"/>
  <line x1="330" y1="42" x2="330" y2="48" stroke="#35556B" stroke-width="3"/>
  <line x1="360" y1="42" x2="360" y2="48" stroke="#35556B" stroke-width="3"/>

  <!-- Tower 2: Stepped Residential Wing (Right) -->
  <rect x="420" y="100" width="140" height="320" fill="url(#towerGrad2)"/>
  <g fill="url(#glassGrad)">
    <rect x="435" y="120" width="50" height="16" rx="1"/>
    <rect x="495" y="120" width="50" height="16" rx="1"/>
    <rect x="435" y="150" width="50" height="16" rx="1"/>
    <rect x="495" y="150" width="50" height="16" rx="1"/>
    <rect x="435" y="180" width="50" height="16" rx="1"/>
    <rect x="495" y="180" width="50" height="16" rx="1"/>
    <rect x="435" y="210" width="50" height="16" rx="1"/>
    <rect x="495" y="210" width="50" height="16" rx="1"/>
    <rect x="435" y="240" width="50" height="16" rx="1"/>
    <rect x="495" y="240" width="50" height="16" rx="1"/>
    <rect x="435" y="270" width="50" height="16" rx="1"/>
    <rect x="495" y="270" width="50" height="16" rx="1"/>
    <rect x="435" y="300" width="50" height="16" rx="1"/>
    <rect x="495" y="300" width="50" height="16" rx="1"/>
    <rect x="435" y="330" width="50" height="16" rx="1"/>
    <rect x="495" y="330" width="50" height="16" rx="1"/>
  </g>
  <line x1="420" y1="100" x2="420" y2="420" stroke="#343A40" stroke-width="4"/>
  <line x1="490" y1="100" x2="490" y2="420" stroke="#343A40" stroke-width="2"/>
  <line x1="560" y1="100" x2="560" y2="420" stroke="#343A40" stroke-width="4"/>

  <!-- Landscaped Podium Base & Garden Terrace -->
  <rect x="180" y="380" width="440" height="40" fill="url(#podiumGrad)"/>
  <circle cx="210" cy="375" r="16" fill="#3B674C"/>
  <circle cx="230" cy="378" r="12" fill="#497E5E"/>
  <circle cx="390" cy="374" r="14" fill="#3B674C"/>
  <circle cx="410" cy="376" r="10" fill="#497E5E"/>
  <circle cx="580" cy="374" r="15" fill="#3B674C"/>

  <!-- Ground Plane & Paved Forecourt -->
  <rect x="0" y="420" width="800" height="80" fill="#0F172A"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#497E5E" stroke-width="2"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#1E293B" stroke-width="1"/>

  <!-- Technical Overlay HUD Badge -->
  <rect x="30" y="30" width="180" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#497E5E"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#497E5E" letter-spacing="1">GDR ARCHITECTURE</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">RESIDENTIAL SECTOR</text>
</svg>
