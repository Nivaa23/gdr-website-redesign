<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hospSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#192834"/>
      <stop offset="100%" stop-color="#35556B"/>
    </linearGradient>
    <linearGradient id="medGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="whiteClad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hospSky)"/>

  <!-- Hospital Main Block Structure -->
  <rect x="140" y="90" width="520" height="330" fill="url(#whiteClad)" rx="2"/>

  <!-- Continuous Glass Curtain Wall -->
  <rect x="170" y="110" width="460" height="190" fill="url(#medGlass)" rx="1"/>

  <!-- Glass Mullions Grid -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.6">
    <line x1="220" y1="110" x2="220" y2="300"/>
    <line x1="270" y1="110" x2="270" y2="300"/>
    <line x1="320" y1="110" x2="320" y2="300"/>
    <line x1="370" y1="110" x2="370" y2="300"/>
    <line x1="420" y1="110" x2="420" y2="300"/>
    <line x1="470" y1="110" x2="470" y2="300"/>
    <line x1="520" y1="110" x2="520" y2="300"/>
    <line x1="570" y1="110" x2="570" y2="300"/>

    <line x1="170" y1="150" x2="630" y2="150"/>
    <line x1="170" y1="190" x2="630" y2="190"/>
    <line x1="170" y1="230" x2="630" y2="230"/>
    <line x1="170" y1="270" x2="630" y2="270"/>
  </g>

  <!-- Emergency & Trauma Center Cantilevered Canopy -->
  <polygon points="120,320 400,320 380,360 120,360" fill="#DC2626"/>
  <rect x="120" y="360" width="260" height="60" fill="#FFFFFF"/>
  <text x="140" y="345" font-family="'Geist Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">+ EMERGENCY &amp; TRAUMA</text>
  <rect x="220" y="375" width="60" height="45" fill="#0284C7"/>
  <rect x="300" y="375" width="60" height="45" fill="#0284C7"/>

  <!-- Main Patient Entrance Portico (Right) -->
  <rect x="420" y="330" width="220" height="15" fill="#35556B"/>
  <line x1="440" y1="345" x2="440" y2="420" stroke="#35556B" stroke-width="8"/>
  <line x1="620" y1="345" x2="620" y2="420" stroke="#35556B" stroke-width="8"/>
  <rect x="460" y="350" width="140" height="70" fill="url(#medGlass)"/>

  <!-- Hospital Cross Emblem on Crown -->
  <rect x="385" y="55" width="30" height="30" rx="3" fill="#DC2626"/>
  <rect x="396" y="60" width="8" height="20" fill="#FFFFFF"/>
  <rect x="390" y="66" width="20" height="8" fill="#FFFFFF"/>

  <!-- Ground Plane & Curbs -->
  <rect x="0" y="420" width="800" height="80" fill="#0F172A"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#DC2626" stroke-width="2"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#DC2626"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#DC2626" letter-spacing="1">HEALTHCARE SECTOR</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">CIVIL HOSPITAL</text>
</svg>
