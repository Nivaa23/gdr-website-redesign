<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="audSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shellGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="shellGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#audSky)"/>

  <!-- Dramatic Sculpted Auditorium Shells -->
  <!-- Outer Shell Left -->
  <polygon points="120,420 180,180 340,110 400,260 260,420" fill="url(#shellGrad2)"/>

  <!-- Upper Cantilevered Acoustic Roof Shell -->
  <polygon points="180,180 340,110 560,110 680,210 520,240 360,200" fill="url(#shellGrad1)"/>

  <!-- Faceted Triangulated Acoustic Wall Planes -->
  <polygon points="400,260 520,240 680,210 640,420 480,420" fill="url(#shellGrad2)"/>
  <polygon points="360,200 480,220 420,320 320,280" fill="url(#shellGrad1)"/>
  <polygon points="480,220 580,230 540,340 440,330" fill="url(#shellGrad1)"/>
  <polygon points="580,230 680,210 640,360 560,350" fill="url(#shellGrad2)"/>

  <!-- Grand Glass Foyer with Warm Interior Illumination -->
  <polygon points="260,420 320,280 440,330 540,340 640,360 620,420" fill="url(#amberGlow)"/>

  <!-- Glass Mullions in Foyer -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.6">
    <line x1="320" y1="280" x2="310" y2="420"/>
    <line x1="370" y1="305" x2="370" y2="420"/>
    <line x1="420" y1="320" x2="430" y2="420"/>
    <line x1="480" y1="335" x2="490" y2="420"/>
    <line x1="540" y1="340" x2="550" y2="420"/>
    <line x1="590" y1="350" x2="600" y2="420"/>
  </g>

  <!-- Civic Forecourt & Terraced Steps -->
  <rect x="0" y="420" width="800" height="80" fill="#0B101B"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="160" y1="440" x2="680" y2="440" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="460" x2="720" y2="460" stroke="#334155" stroke-width="1"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#F59E0B"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#F59E0B" letter-spacing="1">CULTURAL SECTOR</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">CIVIC AUDITORIUM</text>
</svg>
