<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hangar2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="100%" stop-color="#2D3D4E"/>
    </linearGradient>
    <linearGradient id="curvedRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hangar2Sky)"/>

  <!-- Curved Arch Industrial Spanned Roof -->
  <path d="M100,400 Q400,60 700,400 Z" fill="url(#curvedRoof)"/>
  
  <!-- Outer Arch Truss Profile -->
  <path d="M100,400 Q400,60 700,400" fill="none" stroke="#35556B" stroke-width="12"/>
  <path d="M130,400 Q400,100 670,400" fill="none" stroke="#35556B" stroke-width="8"/>

  <!-- Curved Radial Truss Struts -->
  <g stroke="#E2E8F0" stroke-width="2" opacity="0.7">
    <line x1="200" y1="280" x2="220" y2="305"/>
    <line x1="260" y1="205" x2="280" y2="235"/>
    <line x1="330" y1="150" x2="345" y2="185"/>
    <line x1="400" y1="125" x2="400" y2="165"/>
    <line x1="470" y1="150" x2="455" y2="185"/>
    <line x1="540" y1="205" x2="520" y2="235"/>
    <line x1="600" y1="280" x2="580" y2="305"/>
  </g>

  <!-- Clear Opening Interior Bay -->
  <path d="M150,400 Q400,150 650,400 Z" fill="#0C131A"/>

  <!-- Industrial Heavy Gantry Crane Structure Inside -->
  <rect x="180" y="240" width="440" height="18" fill="#FBBF24"/>
  <rect x="360" y="258" width="80" height="30" fill="#D97706"/>
  <line x1="400" y1="288" x2="400" y2="340" stroke="#000000" stroke-width="2"/>
  <polygon points="390,340 410,340 400,360" fill="#000000"/>

  <!-- Equipment & Logistics Floor -->
  <rect x="0" y="400" width="800" height="100" fill="#1A202C"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#497E5E" stroke-width="2"/>
  <!-- Safety perimeter hatch marks -->
  <line x1="200" y1="400" x2="215" y2="415" stroke="#FBBF24" stroke-width="2"/>
  <line x1="230" y1="400" x2="245" y2="415" stroke="#FBBF24" stroke-width="2"/>
  <line x1="260" y1="400" x2="275" y2="415" stroke="#FBBF24" stroke-width="2"/>
  <line x1="520" y1="400" x2="535" y2="415" stroke="#FBBF24" stroke-width="2"/>
  <line x1="550" y1="400" x2="565" y2="415" stroke="#FBBF24" stroke-width="2"/>
  <line x1="580" y1="400" x2="595" y2="415" stroke="#FBBF24" stroke-width="2"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#FBBF24"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#FCD34D" letter-spacing="1">INDUSTRIAL LOGISTICS</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">SPANNED EQUIPMENT HANGAR</text>
</svg>
