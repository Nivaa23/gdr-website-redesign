<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="medInstSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="medFins" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="silverWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#medInstSky)"/>

  <!-- Left Medical Block -->
  <rect x="120" y="120" width="260" height="300" fill="url(#silverWall)" rx="2"/>
  
  <!-- Right Clinical Pavillion -->
  <rect x="420" y="100" width="260" height="320" fill="url(#silverWall)" rx="2"/>

  <!-- Central Glazed Skybridge Connector -->
  <rect x="360" y="170" width="80" height="60" fill="#38BDF8" opacity="0.85" rx="2"/>
  <line x1="360" y1="190" x2="440" y2="190" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="360" y1="210" x2="440" y2="210" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Sunshading Louvers & Solar Fins (Left Block) -->
  <g fill="url(#medFins)">
    <rect x="140" y="150" width="220" height="8" rx="1"/>
    <rect x="140" y="180" width="220" height="8" rx="1"/>
    <rect x="140" y="210" width="220" height="8" rx="1"/>
    <rect x="140" y="240" width="220" height="8" rx="1"/>
    <rect x="140" y="270" width="220" height="8" rx="1"/>
    <rect x="140" y="300" width="220" height="8" rx="1"/>
    <rect x="140" y="330" width="220" height="8" rx="1"/>
  </g>

  <!-- Right Block Window Grid -->
  <g fill="#0F172A">
    <rect x="445" y="130" width="60" height="30" rx="1"/>
    <rect x="525" y="130" width="60" height="30" rx="1"/>
    <rect x="605" y="130" width="55" height="30" rx="1"/>

    <rect x="445" y="180" width="60" height="30" rx="1"/>
    <rect x="525" y="180" width="60" height="30" rx="1"/>
    <rect x="605" y="180" width="55" height="30" rx="1"/>

    <rect x="445" y="230" width="60" height="30" rx="1"/>
    <rect x="525" y="230" width="60" height="30" rx="1"/>
    <rect x="605" y="230" width="55" height="30" rx="1"/>

    <rect x="445" y="280" width="60" height="30" rx="1"/>
    <rect x="525" y="280" width="60" height="30" rx="1"/>
    <rect x="605" y="280" width="55" height="30" rx="1"/>
  </g>

  <!-- Main Entrance Canopy & Plaza -->
  <polygon points="320,380 480,380 460,420 340,420" fill="#35556B"/>
  <rect x="0" y="420" width="800" height="80" fill="#0B131E"/>

  <!-- Healing Landscape Gardens -->
  <ellipse cx="220" cy="425" rx="60" ry="12" fill="#3D684D"/>
  <circle cx="200" cy="410" r="14" fill="#497E5E"/>
  <circle cx="240" cy="412" r="16" fill="#3B674C"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#0284C7"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8" letter-spacing="1">MEDICAL INSTITUTE</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">REGIONAL HEALTHCARE</text>
</svg>
