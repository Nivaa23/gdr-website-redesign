<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="res2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A38"/>
      <stop offset="100%" stop-color="#2D485C"/>
    </linearGradient>
    <linearGradient id="villaWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="terracottaRoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C25E3E"/>
      <stop offset="100%" stop-color="#8C381F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#res2Sky)"/>
  
  <!-- Perspective Township Road -->
  <polygon points="400,260 410,260 580,500 220,500" fill="#1E293B"/>
  <line x1="405" y1="260" x2="400" y2="500" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="16 12"/>

  <!-- Left Villa 1 -->
  <polygon points="120,280 200,220 280,280" fill="url(#terracottaRoof)"/>
  <rect x="130" y="280" width="140" height="130" fill="url(#villaWall)"/>
  <rect x="150" y="300" width="40" height="40" fill="url(#glass)"/>
  <rect x="210" y="300" width="40" height="40" fill="url(#glass)"/>
  <rect x="180" y="355" width="35" height="55" fill="#35556B"/>
  <circle cx="95" cy="360" r="30" fill="#497E5E"/>
  <circle cx="115" cy="340" r="22" fill="#366147"/>

  <!-- Right Villa 2 -->
  <polygon points="520,280 600,220 680,280" fill="url(#terracottaRoof)"/>
  <rect x="530" y="280" width="140" height="130" fill="url(#villaWall)"/>
  <rect x="550" y="300" width="40" height="40" fill="url(#glass)"/>
  <rect x="610" y="300" width="40" height="40" fill="url(#glass)"/>
  <rect x="580" y="355" width="35" height="55" fill="#35556B"/>
  <circle cx="705" cy="360" r="30" fill="#497E5E"/>
  <circle cx="685" cy="340" r="22" fill="#366147"/>

  <!-- Midground Villas -->
  <polygon points="260,240 310,200 360,240" fill="url(#terracottaRoof)"/>
  <rect x="270" y="240" width="80" height="80" fill="url(#villaWall)"/>
  <rect x="285" y="255" width="20" height="20" fill="url(#glass)"/>

  <polygon points="440,240 490,200 540,240" fill="url(#terracottaRoof)"/>
  <rect x="450" y="240" width="80" height="80" fill="url(#villaWall)"/>
  <rect x="495" y="255" width="20" height="20" fill="url(#glass)"/>

  <!-- Landscape Greenery & Parkway -->
  <rect x="0" y="410" width="220" height="90" fill="#2E4D3B"/>
  <rect x="580" y="410" width="220" height="90" fill="#2E4D3B"/>
  
  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#497E5E"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#497E5E" letter-spacing="1">TOWNSHIP SCHEME</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">STAFF RESIDENTIAL</text>
</svg>
