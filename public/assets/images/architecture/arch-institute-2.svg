<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="polySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B252F"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="yellowFin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#polySky)"/>

  <!-- Polytechnic Block with Cantilevers -->
  <polygon points="120,380 120,140 380,140 380,180 680,180 680,380" fill="#E2E8F0"/>
  <polygon points="380,180 680,180 660,110 380,110" fill="#35556B"/>

  <!-- Vertical Brise-Soleil Sun Fins (Left Block) -->
  <g fill="url(#yellowFin)">
    <rect x="140" y="160" width="8" height="190"/>
    <rect x="170" y="160" width="8" height="190"/>
    <rect x="200" y="160" width="8" height="190"/>
    <rect x="230" y="160" width="8" height="190"/>
    <rect x="260" y="160" width="8" height="190"/>
    <rect x="290" y="160" width="8" height="190"/>
    <rect x="320" y="160" width="8" height="190"/>
    <rect x="350" y="160" width="8" height="190"/>
  </g>

  <!-- Laboratory Horizontal Ribbon Windows (Right Block) -->
  <rect x="410" y="210" width="240" height="30" fill="#0284C7"/>
  <rect x="410" y="270" width="240" height="30" fill="#0284C7"/>
  <rect x="410" y="330" width="240" height="30" fill="#0284C7"/>

  <!-- Ground Plaza & Student Amphitheater -->
  <rect x="0" y="380" width="800" height="120" fill="#0F172A"/>
  <polygon points="360,380 460,380 490,460 330,460" fill="#1E293B"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#FBBF24"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#FBBF24" letter-spacing="1">POLYTECHNIC CAMPUS</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TECHNICAL BLOCK</text>
</svg>
