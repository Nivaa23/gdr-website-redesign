<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-interior2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c22"/>
      <stop offset="100%" stop-color="#222f3a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-interior2)"/>

  <!-- High-ceiling Grand Atrium / Institutional Foyer -->
  <!-- Skylight grid above -->
  <polygon points="150,0 450,0 400,80 200,80" fill="#35556B" stroke="#7eb3d4" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="200" y1="0" x2="240" y2="80"/>
    <line x1="260" y1="0" x2="280" y2="80"/>
    <line x1="340" y1="0" x2="320" y2="80"/>
    <line x1="400" y1="0" x2="360" y2="80"/>
    <line x1="175" y1="40" x2="425" y2="40"/>
  </g>

  <!-- Curving sculptural staircase in atrium -->
  <path d="M 120,380 Q 200,320 250,240 Q 300,160 380,140 L 410,140 Q 330,160 280,240 Q 230,320 160,380 Z" fill="#497E5E" opacity="0.85"/>
  <path d="M 120,380 Q 200,320 250,240 Q 300,160 380,140" fill="none" stroke="#eedcba" stroke-width="3"/>
  
  <!-- Stair treads hints -->
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5">
    <line x1="135" y1="370" x2="160" y2="370"/>
    <line x1="155" y1="350" x2="185" y2="350"/>
    <line x1="180" y1="330" x2="210" y2="330"/>
    <line x1="210" y1="300" x2="240" y2="300"/>
    <line x1="240" y1="260" x2="270" y2="260"/>
    <line x1="280" y1="210" x2="310" y2="210"/>
    <line x1="330" y1="165" x2="360" y2="165"/>
  </g>

  <!-- Mezzanine walkway -->
  <polygon points="360,140 600,140 600,180 360,180" fill="#2d3c47" stroke="#35556B" stroke-width="1.5"/>
  <!-- Glass railing on mezzanine -->
  <rect x="360" y="110" width="240" height="30" fill="#35556B" opacity="0.3" stroke="#7eb3d4" stroke-width="1"/>

  <!-- Left double-height feature stone wall -->
  <rect x="0" y="80" width="100" height="320" fill="#18232b" stroke="#35556B" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="140" x2="100" y2="140"/>
    <line x1="0" y1="200" x2="100" y2="200"/>
    <line x1="0" y1="260" x2="100" y2="260"/>
    <line x1="0" y1="320" x2="100" y2="320"/>
  </g>

  <!-- Polished terrazzo floor -->
  <polygon points="0,380 600,380 600,400 0,400" fill="#0f1519"/>
  <ellipse cx="280" cy="385" rx="160" ry="8" fill="#eedcba" opacity="0.15"/>

  <!-- Reception pod -->
  <polygon points="420,320 540,320 560,370 400,370" fill="#35556B" stroke="#497E5E" stroke-width="1.5"/>
  <rect x="440" y="300" width="80" height="20" fill="#24333e"/>

  <text x="30" y="45" font-family="'Geist Mono', monospace" font-size="12" fill="#497E5E" letter-spacing="2">GDR ARCHITECTURAL PORTFOLIO</text>
  <text x="30" y="65" font-family="'Hanken Grotesk', sans-serif" font-weight="700" font-size="16" fill="#ffffff">CIVIC ATRIUM &amp; FOYER ARCHITECTURE</text>
</svg>
