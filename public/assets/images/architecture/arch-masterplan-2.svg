<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mixedSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#192531"/>
      <stop offset="100%" stop-color="#35556B"/>
    </linearGradient>
    <linearGradient id="towerGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="retailPodium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mixedSky)"/>

  <!-- Twin Corporate Commercial Office Towers -->
  <!-- Tower A (Left) -->
  <rect x="220" y="80" width="140" height="300" fill="url(#towerGlass)" rx="2"/>
  <!-- Floor Grid Lines -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.4">
    <line x1="220" y1="120" x2="360" y2="120"/>
    <line x1="220" y1="160" x2="360" y2="160"/>
    <line x1="220" y1="200" x2="360" y2="200"/>
    <line x1="220" y1="240" x2="360" y2="240"/>
    <line x1="220" y1="280" x2="360" y2="280"/>
    <line x1="220" y1="320" x2="360" y2="320"/>
  </g>

  <!-- Tower B (Right, Offset) -->
  <rect x="420" y="110" width="140" height="270" fill="url(#towerGlass)" rx="2"/>
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.4">
    <line x1="420" y1="150" x2="560" y2="150"/>
    <line x1="420" y1="190" x2="560" y2="190"/>
    <line x1="420" y1="230" x2="560" y2="230"/>
    <line x1="420" y1="270" x2="560" y2="270"/>
    <line x1="420" y1="310" x2="560" y2="310"/>
  </g>

  <!-- Sky Lounge Connecting Bridge -->
  <rect x="360" y="160" width="60" height="30" fill="#F8FAFC" rx="1"/>
  <rect x="365" y="165" width="50" height="20" fill="#38BDF8"/>

  <!-- Multi-Level Retail & Dining Podium -->
  <rect x="140" y="340" width="500" height="80" fill="url(#retailPodium)" rx="2"/>
  
  <!-- Retail Storefront Glazing -->
  <rect x="160" y="360" width="80" height="45" fill="#0F172A"/>
  <rect x="260" y="360" width="80" height="45" fill="#0F172A"/>
  <rect x="360" y="360" width="80" height="45" fill="#0F172A"/>
  <rect x="460" y="360" width="80" height="45" fill="#0F172A"/>
  <rect x="550" y="360" width="70" height="45" fill="#0F172A"/>

  <!-- Civic Urban Plaza Forecourt -->
  <rect x="0" y="420" width="800" height="80" fill="#0F172A"/>
  <polygon points="340,420 440,420 480,500 300,500" fill="#1E293B"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#38BDF8"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8" letter-spacing="1">COMMERCIAL SECTOR</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">MIXED DEVELOPMENT</text>
</svg>
