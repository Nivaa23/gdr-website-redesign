<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hangarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2833"/>
      <stop offset="100%" stop-color="#3B4E61"/>
    </linearGradient>
    <linearGradient id="metalTruss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hangarSky)"/>

  <!-- Giant Hangar Portal Frame Outline -->
  <polygon points="80,140 160,80 640,80 720,140 720,400 80,400" fill="#1A222C"/>

  <!-- Steel Box Girder Portal Trusses -->
  <polygon points="100,140 170,95 630,95 700,140 680,140 620,105 180,105 120,140" fill="url(#metalTruss)"/>
  <rect x="90" y="140" width="25" height="260" fill="url(#metalTruss)"/>
  <rect x="685" y="140" width="25" height="260" fill="url(#metalTruss)"/>

  <!-- Internal Cross Lattice Bracing -->
  <g stroke="#94A3B8" stroke-width="1.5" opacity="0.6">
    <line x1="170" y1="95" x2="220" y2="140"/>
    <line x1="220" y1="140" x2="270" y2="95"/>
    <line x1="270" y1="95" x2="320" y2="140"/>
    <line x1="320" y1="140" x2="370" y2="95"/>
    <line x1="370" y1="95" x2="420" y2="140"/>
    <line x1="420" y1="140" x2="470" y2="95"/>
    <line x1="470" y1="95" x2="520" y2="140"/>
    <line x1="520" y1="140" x2="570" y2="95"/>
    <line x1="570" y1="95" x2="620" y2="140"/>
    <line x1="620" y1="140" x2="670" y2="95"/>
  </g>

  <!-- Clear Span Internal High Bay -->
  <rect x="135" y="150" width="530" height="250" fill="#0C1117"/>

  <!-- Telescopic Sliding Industrial Hangar Doors (Folded on Flanks) -->
  <rect x="135" y="170" width="70" height="230" fill="url(#doorGrad)"/>
  <line x1="158" y1="170" x2="158" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="182" y1="170" x2="182" y2="400" stroke="#475569" stroke-width="2"/>

  <rect x="595" y="170" width="70" height="230" fill="url(#doorGrad)"/>
  <line x1="618" y1="170" x2="618" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="642" y1="170" x2="642" y2="400" stroke="#475569" stroke-width="2"/>

  <!-- Aircraft Silhouette Inside Hangar -->
  <!-- Swept Wings & Tail Fin -->
  <polygon points="400,230 430,270 540,320 520,335 425,310 425,350 445,370 415,370 400,355 385,370 355,370 375,350 375,310 280,335 260,320 370,270" fill="#E2E8F0" opacity="0.85"/>
  <!-- Fuselage -->
  <ellipse cx="400" cy="300" rx="18" ry="70" fill="#FFFFFF"/>
  <circle cx="400" cy="235" r="14" fill="#38BDF8"/>

  <!-- Concrete Apron Tarmac & Ground Markings -->
  <rect x="0" y="400" width="800" height="100" fill="#1E293B"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#E5A93C" stroke-width="3"/>
  <!-- Taxiway guidance centerline -->
  <line x1="400" y1="400" x2="400" y2="500" stroke="#FBBF24" stroke-width="3" stroke-dasharray="16 10"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#38BDF8"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8" letter-spacing="1">AVIATION INFRASTRUCTURE</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">MAINTENANCE HANGAR</text>
</svg>
