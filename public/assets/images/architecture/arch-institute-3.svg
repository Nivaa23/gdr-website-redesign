<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="libSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111B24"/>
      <stop offset="100%" stop-color="#233544"/>
    </linearGradient>
    <linearGradient id="atriumGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#libSky)"/>

  <!-- Dramatic Cantilevered Central Library Wing -->
  <polygon points="160,220 640,160 640,280 160,340" fill="#F8FAFC"/>
  <polygon points="180,230 620,175 620,270 180,325" fill="url(#atriumGlass)"/>

  <!-- Lower Research Pods with Stone Cladding -->
  <rect x="200" y="320" width="180" height="90" fill="#35556B"/>
  <rect x="420" y="300" width="180" height="110" fill="#35556B"/>

  <!-- Diagonal Structural Bracing V-Columns -->
  <line x1="240" y1="410" x2="280" y2="330" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="320" y1="410" x2="280" y2="330" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="480" y1="410" x2="520" y2="310" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="560" y1="410" x2="520" y2="310" stroke="#FFFFFF" stroke-width="8"/>

  <!-- Ground Plane & Reflective Water Pond -->
  <rect x="0" y="410" width="800" height="90" fill="#090E14"/>
  <ellipse cx="400" cy="430" rx="260" ry="25" fill="#0284C7" opacity="0.6"/>

  <rect x="30" y="30" width="190" height="44" rx="3" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="45" cy="52" r="4" fill="#38BDF8"/>
  <text x="58" y="48" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8" letter-spacing="1">LEARNING COMMONS</text>
  <text x="58" y="62" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">CAMPUS CENTRAL LIBRARY</text>
</svg>
