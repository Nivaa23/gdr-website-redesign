<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Soil Analysis and Physico-Chemical Parameters Schematic">
  <defs>
    <linearGradient id="soBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2420"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>
    <pattern id="soGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#497E5E" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#soBg)"/>
  <rect width="500" height="320" fill="url(#soGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">SOIL STRATA &amp; PHYSICO-CHEMICAL TESTING</text>
    <text x="360" y="26" fill="#497E5E">MOEFCC &amp; IS 2720</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#497E5E" stroke-opacity="0.4"/>
  </g>
  <!-- Soil Strata Core Cross-Section -->
  <g transform="translate(60, 60)">
    <!-- Topsoil Layer -->
    <rect x="0" y="20" width="160" height="35" fill="#253A2D" stroke="#497E5E" stroke-width="1.2"/>
    <text x="170" y="42" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">HORIZON A: TOPSOIL / ORGANIC</text>
    <!-- Subsoil Layer -->
    <rect x="0" y="55" width="160" height="50" fill="#1C2E25" stroke="#497E5E" stroke-width="1.2"/>
    <text x="170" y="85" font-family="'Geist Mono', monospace" font-size="8" fill="#E2E8F0">HORIZON B: CLAY &amp; MINERAL SUBSTRATE</text>
    <!-- Weathered Bedrock Layer -->
    <rect x="0" y="105" width="160" height="60" fill="#14221B" stroke="#35556B" stroke-width="1.2"/>
    <text x="170" y="140" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">HORIZON C: WEATHERED PARENT ROCK</text>
  </g>
  <!-- Lab Metric Callout Box -->
  <g transform="translate(230, 210)">
    <rect width="220" height="75" rx="3" fill="#0D1612" stroke="#497E5E" stroke-width="1"/>
    <text x="14" y="22" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" font-weight="700">SOIL QUALITY METRICS</text>
    <text x="14" y="40" font-family="'Geist Mono', monospace" font-size="8" fill="#E2E8F0">pH &bull; ELECTRICAL CONDUCTIVITY &bull; N-P-K</text>
    <text x="14" y="54" font-family="'Geist Mono', monospace" font-size="8" fill="#E2E8F0">HEAVY METAL SPECIATION (Pb, Cd, Cr, As)</text>
    <text x="14" y="68" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">ORGANIC CARBON &bull; WATER PERMEABILITY</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
