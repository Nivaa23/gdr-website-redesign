<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Reclamation and Resource Recovery System Schematic">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142426"/>
      <stop offset="100%" stop-color="#0E191A"/>
    </linearGradient>
    <pattern id="rGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#497E5E" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#rBg)"/>
  <rect width="500" height="320" fill="url(#rGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">RESOURCE RECOVERY &amp; RECLAMATION</text>
    <text x="350" y="26" fill="#497E5E">CIRCULAR INDUSTRIAL LOOPS</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#497E5E" stroke-opacity="0.4"/>
  </g>
  <!-- Circular Closed-Loop Flow Graphic -->
  <g transform="translate(250, 160)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#35556B" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="50" fill="#112220" stroke="#497E5E" stroke-width="1.8"/>
    <!-- Recycle Arrows Loop -->
    <path d="M 0 -70 A 70 70 0 0 1 60 35" fill="none" stroke="#A3E8BF" stroke-width="2.5"/>
    <path d="M 60 35 A 70 70 0 0 1 -60 35" fill="none" stroke="#A3E8BF" stroke-width="2.5"/>
    <path d="M -60 35 A 70 70 0 0 1 0 -70" fill="none" stroke="#A3E8BF" stroke-width="2.5"/>
    <!-- Node Markers -->
    <circle cx="0" cy="-70" r="6" fill="#497E5E"/>
    <circle cx="60" cy="35" r="6" fill="#497E5E"/>
    <circle cx="-60" cy="35" r="6" fill="#497E5E"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" fill="#A3E8BF">ZERO WASTE</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94A3B8">RECOVERY</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
