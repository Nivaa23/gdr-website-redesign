<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="structBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192A38"/>
      <stop offset="60%" stop-color="#14222E"/>
      <stop offset="100%" stop-color="#0E1720"/>
    </linearGradient>
    <pattern id="structGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4A708B" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="400" height="190" fill="url(#structBg)"/>
  <rect width="400" height="190" fill="url(#structGrid)"/>

  <!-- 3D Structural Steel Framing & Truss Wireframe -->
  <g stroke="#395870" stroke-width="1.2" opacity="0.45" fill="none">
    <!-- Base Column Line & Footings -->
    <path d="M 40 160 L 140 110 L 260 110 L 360 160"/>
    <path d="M 40 160 L 40 50 L 140 20 L 260 20 L 360 50 L 360 160"/>
    <path d="M 140 110 L 140 20"/>
    <path d="M 260 110 L 260 20"/>
    
    <!-- Cross Bracing / Warren Truss Diagonals -->
    <path d="M 40 50 L 140 110 M 140 20 L 40 160"/>
    <path d="M 140 20 L 260 110 M 260 20 L 140 110"/>
    <path d="M 260 20 L 360 160 M 360 50 L 260 110"/>

    <!-- Bottom Ties -->
    <line x1="40" y1="160" x2="360" y2="160" stroke="#497E5E" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- Finite Element Stress Nodes -->
  <g fill="#497E5E" opacity="0.8">
    <circle cx="40" cy="50" r="3"/>
    <circle cx="140" cy="20" r="3"/>
    <circle cx="260" cy="20" r="3"/>
    <circle cx="360" cy="50" r="3"/>
    <circle cx="40" cy="160" r="3"/>
    <circle cx="140" cy="110" r="3"/>
    <circle cx="260" cy="110" r="3"/>
    <circle cx="360" cy="160" r="3"/>
  </g>

  <!-- Centerpiece Technical Badge with Structure Icon -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#14232F" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Structure Icon -->
    <rect x="10" y="8" width="28" height="32" stroke="#E2E8F0" stroke-width="2.2" fill="none"/>
    <path d="M10 8L38 40M38 8L10 40" stroke="#E2E8F0" stroke-width="1.8"/>
    <path d="M10 24H38" stroke="#497E5E" stroke-width="2.2"/>
    <circle cx="24" cy="24" r="3" fill="#497E5E"/>
  </g>

  <!-- Registration Marks -->
  <g stroke="#4A708B" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Metadata -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88A8BF" letter-spacing="1.5" opacity="0.75">STRUCTURAL ENG // 02</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.85">STAAD / ETABS ANALYSIS</text>
</svg>
