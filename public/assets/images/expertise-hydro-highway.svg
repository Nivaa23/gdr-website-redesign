<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2E3D"/>
      <stop offset="60%" stop-color="#162531"/>
      <stop offset="100%" stop-color="#0E1922"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4A708B" stroke-width="0.75" stroke-opacity="0.22"/>
    </pattern>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#497E5E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#35556B" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="190" fill="url(#bgGrad)"/>
  <rect width="400" height="190" fill="url(#gridPattern)"/>

  <!-- Topo Contour Elevation Curves (Hydro & Topography Context) -->
  <g fill="none" stroke="#3D627D" stroke-width="1" opacity="0.35">
    <path d="M-20 60 C 80 40, 160 90, 240 70 C 320 50, 360 80, 420 65"/>
    <path d="M-20 90 C 70 70, 150 120, 250 100 C 330 80, 370 110, 420 95"/>
    <path d="M-20 120 C 60 100, 140 150, 260 130 C 340 110, 380 140, 420 125"/>
    <path d="M-20 150 C 50 130, 130 180, 270 160 C 350 140, 390 170, 420 155"/>
  </g>

  <!-- Highway Alignment Corridor Ribbon -->
  <path d="M 20 190 Q 140 140, 200 95 T 380 20" fill="none" stroke="#2A4356" stroke-width="36" stroke-linecap="round"/>
  <path d="M 20 190 Q 140 140, 200 95 T 380 20" fill="none" stroke="url(#roadGrad)" stroke-width="32" stroke-linecap="round"/>
  <!-- Outer Highway Edge Lines -->
  <path d="M 8 190 Q 130 138, 190 93 T 370 18" fill="none" stroke="#4A708B" stroke-width="1.5" opacity="0.6"/>
  <path d="M 32 190 Q 150 142, 210 97 T 390 22" fill="none" stroke="#4A708B" stroke-width="1.5" opacity="0.6"/>
  <!-- Dashed Centerline -->
  <path d="M 20 190 Q 140 140, 200 95 T 380 20" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 6" opacity="0.85"/>

  <!-- Hydro Flow Vectors (Water Drainage Channels) -->
  <g fill="none" stroke="#497E5E" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6">
    <path d="M 60 40 Q 120 70, 170 85"/>
    <path d="M 170 85 Q 230 100, 310 140"/>
    <path d="M 90 25 Q 160 55, 230 75"/>
  </g>

  <!-- Service Icon Central Technical Badge -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#14232F" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Hydro Highway Icon -->
    <path d="M6 38L18 10H30L42 38" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 16V22M24 28V34" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M10 26C14 24 17 28 21 26C25 24 28 28 32 26C36 24 39 27 42 26" stroke="#497E5E" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
  </g>

  <!-- Technical Drafting Registration Marks & Benchmarks -->
  <g stroke="#4A708B" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Technical Metadata Watermark -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88A8BF" letter-spacing="1.5" opacity="0.75">ALIGNMENT DPR // 02</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.85">CH: 48+250 KM</text>
</svg>
