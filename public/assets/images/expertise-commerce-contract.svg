<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D3C"/>
      <stop offset="60%" stop-color="#142330"/>
      <stop offset="100%" stop-color="#0E1821"/>
    </linearGradient>
    <pattern id="ccGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4A708B" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="400" height="190" fill="url(#ccBg)"/>
  <rect width="400" height="190" fill="url(#ccGrid)"/>

  <!-- Quantity Surveying & BOQ Contract Schedule Ledger Lines -->
  <g stroke="#37556C" stroke-width="1" opacity="0.4">
    <!-- Header Rule -->
    <line x1="30" y1="40" x2="370" y2="40" stroke-width="1.5"/>
    <line x1="30" y1="65" x2="370" y2="65"/>
    <line x1="30" y1="90" x2="370" y2="90"/>
    <line x1="30" y1="115" x2="370" y2="115"/>
    <line x1="30" y1="140" x2="370" y2="140"/>
    <line x1="30" y1="165" x2="370" y2="165"/>

    <!-- Column Dividers -->
    <line x1="80" y1="30" x2="80" y2="175"/>
    <line x1="220" y1="30" x2="220" y2="175"/>
    <line x1="300" y1="30" x2="300" y2="175"/>
  </g>

  <!-- Contractual BOQ Line Item Bars -->
  <g fill="#4A708B" opacity="0.35">
    <rect x="90" y="48" width="110" height="8" rx="2"/>
    <rect x="90" y="73" width="90" height="8" rx="2"/>
    <rect x="90" y="98" width="120" height="8" rx="2"/>
    <rect x="90" y="123" width="70" height="8" rx="2"/>
    <rect x="90" y="148" width="100" height="8" rx="2"/>
  </g>
  <!-- Verified Cost Metrics Bars -->
  <g fill="#497E5E" opacity="0.6">
    <rect x="235" y="48" width="50" height="8" rx="2"/>
    <rect x="235" y="73" width="40" height="8" rx="2"/>
    <rect x="235" y="98" width="55" height="8" rx="2"/>
    <rect x="235" y="123" width="35" height="8" rx="2"/>
    <rect x="235" y="148" width="48" height="8" rx="2"/>
  </g>

  <!-- Technical Audit Stamp Graphic -->
  <g transform="translate(325, 60)" stroke="#497E5E" stroke-width="1.2" fill="none" opacity="0.75">
    <circle cx="20" cy="20" r="18" stroke-dasharray="3 2"/>
    <circle cx="20" cy="20" r="14"/>
    <text x="20" y="18" font-family="'Geist Mono', monospace" font-size="5" text-anchor="middle" fill="#497E5E" stroke="none">VERIFIED</text>
    <text x="20" y="25" font-family="'Geist Mono', monospace" font-size="4.5" text-anchor="middle" fill="#88A8BF" stroke="none">FIDIC / BOQ</text>
  </g>

  <!-- Centerpiece Technical Badge with Contract Icon -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#14232F" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Contract Icon -->
    <rect x="11" y="8" width="26" height="32" rx="2" stroke="#E2E8F0" stroke-width="2.2" fill="none"/>
    <path d="M17 16H31M17 22H31M17 28H25" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="29" cy="30" r="4.5" stroke="#497E5E" stroke-width="2" fill="#14232F"/>
    <path d="M27.5 30H30.5M29 28.5V31.5" stroke="#497E5E" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Registration Marks -->
  <g stroke="#4A708B" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Metadata -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88A8BF" letter-spacing="1.5" opacity="0.75">CONTRACT MGMT // 06</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.85">FIDIC / EPC / BOQ VALUATION</text>
</svg>
