<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Ambient Air Quality Monitoring and Meteorological Analysis Schematic">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14222B"/>
      <stop offset="100%" stop-color="#0E161C"/>
    </linearGradient>
    <pattern id="mGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#35556B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#mBg)"/>
  <rect width="500" height="320" fill="url(#mGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">CONTINUOUS AMBIENT AIR &amp; METEOROLOGY</text>
    <text x="360" y="26" fill="#497E5E">CAAQMS / AWS TELEMETRY</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#35556B" stroke-opacity="0.4"/>
  </g>
  <!-- Weather Station / Anemometer / Wind Vane Mast -->
  <g transform="translate(100, 70)">
    <!-- Central Mast -->
    <line x1="60" y1="20" x2="60" y2="180" stroke="#497E5E" stroke-width="2.5"/>
    <!-- Anemometer Cups -->
    <line x1="30" y1="25" x2="90" y2="25" stroke="#A3E8BF" stroke-width="1.8"/>
    <circle cx="30" cy="25" r="5" fill="#A3E8BF"/>
    <circle cx="90" cy="25" r="5" fill="#A3E8BF"/>
    <circle cx="60" cy="20" r="4" fill="#FFFFFF"/>
    <!-- Wind Vane Arrow -->
    <path d="M 40 50 L 80 50 M 75 45 L 85 50 L 75 55" stroke="#A3E8BF" stroke-width="2" fill="none"/>
    <!-- Solar Radiation Sensor & Rain Gauge -->
    <rect x="75" y="80" width="22" height="15" rx="2" fill="#1C2D38" stroke="#497E5E" stroke-width="1.2"/>
    <rect x="25" y="100" width="16" height="24" rx="2" fill="#1C2D38" stroke="#35556B" stroke-width="1.2"/>
  </g>
  <!-- Wind Rose Diagram (Compass Quadrant) -->
  <g transform="translate(340, 150)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#35556B" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#35556B" stroke-width="1"/>
    <line x1="-65" y1="0" x2="65" y2="0" stroke="#35556B" stroke-width="1.2"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#35556B" stroke-width="1.2"/>
    <!-- Cardinal Directions -->
    <text x="0" y="-70" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">N</text>
    <text x="75" y="3" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">E</text>
    <text x="0" y="78" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">S</text>
    <text x="-75" y="3" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">W</text>
    <!-- Dominant Wind Petals -->
    <path d="M 0 0 L -18 -38 L 0 -52 L 10 -35 Z" fill="#497E5E" fill-opacity="0.6" stroke="#A3E8BF" stroke-width="1.2"/>
    <path d="M 0 0 L 25 -10 L 45 0 L 22 12 Z" fill="#35556B" fill-opacity="0.5" stroke="#35556B" stroke-width="1"/>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
