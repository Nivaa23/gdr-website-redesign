<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="bimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2E3E"/>
      <stop offset="60%" stop-color="#152431"/>
      <stop offset="100%" stop-color="#0E1821"/>
    </linearGradient>
    <pattern id="bimGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4A708B" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="400" height="190" fill="url(#bimBg)"/>
  <rect width="400" height="190" fill="url(#bimGrid)"/>

  <!-- 3D Isometric BIM Building Envelope Wireframe -->
  <g stroke="#37556C" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- Level 0 Footprint -->
    <path d="M 120 155 L 200 180 L 280 155 L 200 130 Z"/>
    <!-- Level 1 Slab -->
    <path d="M 120 125 L 200 150 L 280 125 L 200 100 Z"/>
    <!-- Level 2 Slab -->
    <path d="M 120 95 L 200 120 L 280 95 L 200 70 Z"/>
    <!-- Level 3 Roof -->
    <path d="M 120 65 L 200 90 L 280 65 L 200 40 Z"/>

    <!-- Vertical Corner Columns -->
    <line x1="120" y1="155" x2="120" y2="65"/>
    <line x1="200" y1="180" x2="200" y2="90"/>
    <line x1="280" y1="155" x2="280" y2="65"/>
    <line x1="200" y1="130" x2="200" y2="40"/>
  </g>

  <!-- Parametric Curtain Wall Mullions & Glazing Mesh -->
  <g stroke="#497E5E" stroke-width="1" fill="none" opacity="0.6">
    <line x1="160" y1="167" x2="160" y2="77"/>
    <line x1="240" y1="167" x2="240" y2="77"/>
    <line x1="140" y1="140" x2="140" y2="80" stroke-dasharray="2 3"/>
    <line x1="260" y1="140" x2="260" y2="80" stroke-dasharray="2 3"/>
  </g>

  <!-- Coordinate Vector Triad (X, Y, Z) -->
  <g transform="translate(60, 140)" stroke="#88A8BF" stroke-width="1.2" fill="none">
    <line x1="0" y1="0" x2="30" y2="10" stroke="#497E5E"/>
    <line x1="0" y1="0" x2="-25" y2="12"/>
    <line x1="0" y1="0" x2="0" y2="-28"/>
    <text x="34" y="14" font-family="'Geist Mono', monospace" font-size="7" fill="#497E5E">X</text>
    <text x="-32" y="16" font-family="'Geist Mono', monospace" font-size="7" fill="#88A8BF">Y</text>
    <text x="-3" y="-32" font-family="'Geist Mono', monospace" font-size="7" fill="#88A8BF">Z</text>
  </g>

  <!-- Centerpiece Technical Badge with BIM Icon -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#14232F" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- BIM Icon -->
    <path d="M24 6L40 15V33L24 42L8 33V15L24 6Z" stroke="#E2E8F0" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <path d="M24 6V42M24 24L40 15M24 24L8 15" stroke="#E2E8F0" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M16 19.5L32 28.5" stroke="#497E5E" stroke-width="2" stroke-dasharray="2 2"/>
  </g>

  <!-- Registration Marks -->
  <g stroke="#4A708B" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Metadata -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88A8BF" letter-spacing="1.5" opacity="0.75">BIM COORDINATION // 04</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.85">LOD 350 / 400 DIGITAL TWIN</text>
</svg>
