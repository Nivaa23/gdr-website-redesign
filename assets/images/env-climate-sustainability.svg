<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Climate Change and Sustainability Strategy Schematic">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261E"/>
      <stop offset="100%" stop-color="#0E1914"/>
    </linearGradient>
    <pattern id="cGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#497E5E" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#cBg)"/>
  <rect width="500" height="320" fill="url(#cGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">CLIMATE RESILIENCE &amp; DECARBONIZATION</text>
    <text x="360" y="26" fill="#497E5E">GHG PROTOCOL / BRSR</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#497E5E" stroke-opacity="0.4"/>
  </g>
  <!-- Decarbonization Trajectory Curve -->
  <g transform="translate(60, 60)">
    <line x1="20" y1="160" x2="360" y2="160" stroke="#35556B" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="160" stroke="#35556B" stroke-width="1.5"/>
    <!-- Emissions Reduction Path -->
    <path d="M 20 40 Q 150 50 250 110 T 360 145" fill="none" stroke="#A3E8BF" stroke-width="2.5"/>
    <!-- Target Marker -->
    <circle cx="360" cy="145" r="5" fill="#497E5E"/>
    <text x="360" y="130" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" fill="#A3E8BF">NET ZERO</text>
    <text x="180" y="70" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">SCOPE 1, 2, 3 REDUCTION</text>
  </g>
  <g transform="translate(100, 240)">
    <rect width="300" height="45" rx="3" fill="#0C1510" stroke="#497E5E" stroke-width="1"/>
    <text x="14" y="18" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">CARBON ACCOUNTING &bull; CLIMATE RISK ASSESSMENT</text>
    <text x="14" y="32" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">TCFD COMPLIANCE &amp; SCIENCE-BASED TARGETS (SBTi)</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
