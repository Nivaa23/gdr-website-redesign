<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Air Quality and Physical Sampling Analysis Schematic">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19242C"/>
      <stop offset="100%" stop-color="#0E161C"/>
    </linearGradient>
    <pattern id="aGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#35556B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#aBg)"/>
  <rect width="500" height="320" fill="url(#aGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">STACK EMISSION &amp; AIR MONITORING</text>
    <text x="350" y="26" fill="#497E5E">CPCB / SPCB PROTOCOL</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#35556B" stroke-opacity="0.4"/>
  </g>
  <!-- Industrial Stack & Isokinetic Sampling Probe -->
  <g transform="translate(140, 70)">
    <rect x="0" y="20" width="50" height="180" fill="#152028" stroke="#35556B" stroke-width="1.8"/>
    <!-- Sampling Port -->
    <circle cx="50" cy="80" r="6" fill="#497E5E"/>
    <line x1="50" y1="80" x2="150" y2="80" stroke="#A3E8BF" stroke-width="2" stroke-dasharray="3 2"/>
    <!-- Flow Direction Arrows -->
    <path d="M 25 180 V 40" stroke="#497E5E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 50 L 25 40 L 30 50" stroke="#497E5E" stroke-width="2" fill="none"/>
  </g>
  <!-- Sampling Meter Unit -->
  <g transform="translate(300, 110)">
    <rect width="130" height="120" rx="4" fill="#1C2C36" stroke="#497E5E" stroke-width="1.5"/>
    <rect x="15" y="15" width="100" height="35" rx="2" fill="#0C141A" stroke="#35556B" stroke-width="1"/>
    <text x="25" y="32" font-family="'Geist Mono', monospace" font-size="9" fill="#A3E8BF">PM2.5: 28 µg/m³</text>
    <text x="25" y="44" font-family="'Geist Mono', monospace" font-size="9" fill="#A3E8BF">PM10:  54 µg/m³</text>
    <circle cx="35" cy="75" r="12" fill="#0E161C" stroke="#35556B" stroke-width="1"/>
    <circle cx="75" cy="75" r="12" fill="#0E161C" stroke="#35556B" stroke-width="1"/>
    <text x="65" y="105" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#94A3B8">FLOW: 1.1 m³/min</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
