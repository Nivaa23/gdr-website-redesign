<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Water Quality, Biological & Chemical Analysis Schematic">
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14262E"/>
      <stop offset="100%" stop-color="#0E1920"/>
    </linearGradient>
    <pattern id="wGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#35556B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#wBg)"/>
  <rect width="500" height="320" fill="url(#wGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">FIELD LAB // WATER &amp; CHEMICAL ANALYSIS</text>
    <text x="360" y="26" fill="#497E5E">IS 10500:2012 COMPLIANT</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#35556B" stroke-opacity="0.4"/>
  </g>
  <!-- Water Molecule & Flow Waveform -->
  <path d="M 60 170 Q 150 120 250 170 T 440 170" fill="none" stroke="#35556B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 60 190 Q 150 140 250 190 T 440 190" fill="none" stroke="#497E5E" stroke-width="2"/>
  <g transform="translate(250, 150)">
    <!-- Central Pipette & Beaker Test Assembly -->
    <rect x="-35" y="-50" width="70" height="85" rx="6" fill="#182B35" stroke="#497E5E" stroke-width="1.8"/>
    <rect x="-25" y="-15" width="50" height="42" rx="3" fill="#497E5E" fill-opacity="0.25"/>
    <line x1="-30" y1="-5" x2="-15" y2="-5" stroke="#A3E8BF" stroke-width="1.5"/>
    <line x1="-30" y1="10" x2="-10" y2="10" stroke="#A3E8BF" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="4" fill="#A3E8BF" opacity="0.8"/>
    <circle cx="12" cy="0" r="2.5" fill="#A3E8BF" opacity="0.6"/>
  </g>
  <!-- Telemetry Badge -->
  <g transform="translate(30, 230)">
    <rect width="190" height="65" rx="3" fill="#0C151B" stroke="#35556B" stroke-width="1"/>
    <text x="12" y="20" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" font-weight="700">TEST PARAMETERS</text>
    <text x="12" y="38" font-family="'Geist Mono', monospace" font-size="8" fill="#E2E8F0">BOD &bull; COD &bull; DO &bull; TDS &bull; pH</text>
    <text x="12" y="52" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">HEAVY METALS &bull; COLIFORM</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
