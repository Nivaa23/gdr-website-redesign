<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="pmcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D3C"/>
      <stop offset="60%" stop-color="#152431"/>
      <stop offset="100%" stop-color="#0D1821"/>
    </linearGradient>
    <pattern id="pmcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4A708B" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="400" height="190" fill="url(#pmcBg)"/>
  <rect width="400" height="190" fill="url(#pmcGrid)"/>

  <!-- Construction Site Gantt & Coordination Grid Lines -->
  <g stroke="#37556C" stroke-width="1" opacity="0.4">
    <line x1="30" y1="45" x2="370" y2="45"/>
    <line x1="30" y1="75" x2="370" y2="75"/>
    <line x1="30" y1="105" x2="370" y2="105"/>
    <line x1="30" y1="135" x2="370" y2="135"/>
    <line x1="30" y1="165" x2="370" y2="165"/>
    
    <line x1="90" y1="35" x2="90" y2="175" stroke-dasharray="2 3"/>
    <line x1="160" y1="35" x2="160" y2="175" stroke-dasharray="2 3"/>
    <line x1="230" y1="35" x2="230" y2="175" stroke-dasharray="2 3"/>
    <line x1="300" y1="35" x2="300" y2="175" stroke-dasharray="2 3"/>
  </g>

  <!-- Project Milestone Phase Bars -->
  <g rx="3">
    <!-- Phase 1: Planning / QA -->
    <rect x="40" y="58" width="85" height="14" rx="3" fill="#35556B" opacity="0.6"/>
    <!-- Phase 2: Structural Execution -->
    <rect x="110" y="88" width="120" height="14" rx="3" fill="#497E5E" opacity="0.75"/>
    <!-- Phase 3: Systems & Commissioning -->
    <rect x="210" y="118" width="105" height="14" rx="3" fill="#35556B" opacity="0.6"/>
    <!-- Phase 4: Handover Certification -->
    <rect x="290" y="148" width="75" height="14" rx="3" fill="#497E5E" opacity="0.5"/>
  </g>

  <!-- Progress Connectors & Quality Inspection Diamonds -->
  <g fill="#497E5E" stroke="#E2E8F0" stroke-width="1.5">
    <path d="M 125 65 L 130 70 L 125 75 L 120 70 Z"/>
    <path d="M 230 95 L 235 100 L 230 105 L 225 100 Z"/>
    <path d="M 315 125 L 320 130 L 315 135 L 310 130 Z"/>
  </g>

  <!-- Centerpiece Technical Badge with PMC Icon -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#14232F" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- PMC Icon -->
    <rect x="8" y="10" width="32" height="28" rx="3" stroke="#E2E8F0" stroke-width="2.2" fill="none"/>
    <path d="M14 18H26" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M14 24H34" stroke="#497E5E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M14 30H22" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="34" cy="18" r="2.5" fill="#497E5E"/>
    <circle cx="28" cy="30" r="2.5" fill="#E2E8F0"/>
  </g>

  <!-- Corner Registration Coordinates -->
  <g stroke="#4A708B" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Labels -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88A8BF" letter-spacing="1.5" opacity="0.75">CONSULTANCY PMC // 03</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.85">QA / QC CERTIFIED</text>
</svg>
