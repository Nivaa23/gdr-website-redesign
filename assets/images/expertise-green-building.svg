<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190">
  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182D2D"/>
      <stop offset="60%" stop-color="#122324"/>
      <stop offset="100%" stop-color="#0E1919"/>
    </linearGradient>
    <pattern id="gbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#497E5E" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="400" height="190" fill="url(#gbBg)"/>
  <rect width="400" height="190" fill="url(#gbGrid)"/>

  <!-- Passive Bioclimatic Architectural Section Wireframe -->
  <g stroke="#3E6855" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- Building Envelope -->
    <path d="M 50 160 H 350 V 90 L 260 55 H 140 L 50 90 Z"/>
    <!-- Floor Slabs -->
    <line x1="50" y1="125" x2="350" y2="125"/>
    <!-- Overhang Shading Louvers -->
    <path d="M 40 85 L 60 95 M 360 85 L 340 95"/>
    <path d="M 40 120 L 60 130 M 360 120 L 340 130"/>
    <!-- Green Roof Thermal Layer -->
    <path d="M 140 55 H 260" stroke="#497E5E" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Solar Angles & Ventilation Flow Vectors -->
  <g stroke="#497E5E" stroke-width="1.2" fill="none" opacity="0.65">
    <!-- Summer Sun Ray -->
    <line x1="100" y1="20" x2="160" y2="70" stroke-dasharray="3 3"/>
    <!-- Convection Airflow Paths -->
    <path d="M 70 145 Q 110 135, 140 115 T 200 70" stroke-dasharray="4 2"/>
    <path d="M 330 145 Q 290 135, 260 115 T 200 70" stroke-dasharray="4 2"/>
  </g>

  <!-- Centerpiece Technical Badge with Green Building Icon -->
  <g transform="translate(176, 71)">
    <circle cx="24" cy="24" r="32" fill="#11241E" stroke="#497E5E" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
    <circle cx="24" cy="24" r="28" fill="none" stroke="#35556B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Green Building Icon -->
    <path d="M24 8C14 8 10 18 10 28C10 35 15 40 24 40C33 40 38 35 38 28C38 14 28 8 24 8Z" stroke="#497E5E" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <path d="M24 16V36M24 24L16 19M24 30L32 25" stroke="#497E5E" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 42H30" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Registration Marks -->
  <g stroke="#497E5E" stroke-width="1" opacity="0.5">
    <path d="M 12 8 H 20 M 16 4 V 12"/>
    <path d="M 380 8 H 388 M 384 4 V 12"/>
    <path d="M 12 182 H 20 M 16 178 V 186"/>
    <path d="M 380 182 H 388 M 384 178 V 186"/>
  </g>

  <!-- Metadata -->
  <text x="24" y="24" font-family="'Geist Mono', monospace" font-size="9" fill="#88BF9E" letter-spacing="1.5" opacity="0.8">SUSTAINABLE // 05</text>
  <text x="376" y="174" text-anchor="end" font-family="'Geist Mono', monospace" font-size="8.5" fill="#497E5E" letter-spacing="1" opacity="0.9">IGBC / GRIHA / LEED</text>
</svg>
