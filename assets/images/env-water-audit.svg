<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Comprehensive Industrial Water Audit Schematic">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14242D"/>
      <stop offset="100%" stop-color="#0E1920"/>
    </linearGradient>
    <pattern id="waGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#35556B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#waBg)"/>
  <rect width="500" height="320" fill="url(#waGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">INDUSTRIAL WATER BALANCE &amp; AUDITING</text>
    <text x="360" y="26" fill="#497E5E">CGWA / BIS IS 16560</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#35556B" stroke-opacity="0.4"/>
  </g>
  <!-- Sankey-style Water Balance Flow Diagram -->
  <g transform="translate(60, 70)">
    <!-- Intake Stream -->
    <rect x="0" y="50" width="80" height="30" rx="3" fill="#1C303E" stroke="#35556B" stroke-width="1.5"/>
    <text x="40" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">INTAKE: 100%</text>
    <path d="M 80 65 L 140 65" stroke="#35556B" stroke-width="4"/>
    <!-- Process Block -->
    <rect x="140" y="20" width="100" height="90" rx="4" fill="#162934" stroke="#497E5E" stroke-width="1.8"/>
    <text x="190" y="55" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">INDUSTRIAL</text>
    <text x="190" y="70" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="700" fill="#FFFFFF">PROCESS</text>
    <!-- Recirculation / Recycle Branch -->
    <path d="M 190 110 V 140 H 40 V 80" fill="none" stroke="#A3E8BF" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="115" y="152" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7.5" fill="#A3E8BF">RECYCLE / REUSE: 65%</text>
    <!-- Consumption / Discharge Branch -->
    <path d="M 240 65 L 300 65" stroke="#497E5E" stroke-width="2.5"/>
    <rect x="300" y="50" width="80" height="30" rx="3" fill="#1C303E" stroke="#497E5E" stroke-width="1.5"/>
    <text x="340" y="68" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">ZLD / 0% LOSS</text>
  </g>
  <g transform="translate(100, 245)">
    <rect width="300" height="40" rx="3" fill="#0C151B" stroke="#35556B" stroke-width="1"/>
    <text x="14" y="18" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">GROUNDWATER EXTRACTION &bull; SPECIFIC WATER CONSUMPTION</text>
    <text x="14" y="30" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">CGWA NOC COMPLIANCE &amp; RAINWATER RECHARGE AUDITING</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
