<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" aria-label="Stormwater and Water Drainage Systems Schematic">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14222B"/>
      <stop offset="100%" stop-color="#0E161C"/>
    </linearGradient>
    <pattern id="swGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#35556B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#swBg)"/>
  <rect width="500" height="320" fill="url(#swGrid)"/>
  <g font-family="'Geist Mono', monospace" font-size="9" fill="#94A3B8" letter-spacing="1">
    <text x="20" y="26">STORMWATER &amp; RUNOFF DRAINAGE NETWORKS</text>
    <text x="350" y="26" fill="#497E5E">HYDROLOGICAL SWMM MODEL</text>
    <line x1="20" y1="36" x2="480" y2="36" stroke="#35556B" stroke-opacity="0.4"/>
  </g>
  <!-- Catchment Drainage Swale & Infiltration Basin -->
  <g transform="translate(60, 80)">
    <path d="M 20 50 Q 100 120 200 80 T 360 110" fill="none" stroke="#35556B" stroke-width="3"/>
    <path d="M 20 70 Q 100 140 200 100 T 360 130" fill="none" stroke="#497E5E" stroke-width="2.5"/>
    <!-- Bioretention Basin -->
    <ellipse cx="200" cy="140" rx="90" ry="24" fill="#162933" stroke="#497E5E" stroke-width="1.8"/>
    <path d="M 140 140 Q 200 130 260 140" stroke="#A3E8BF" stroke-width="1.5" fill="none"/>
    <text x="200" y="145" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">BIORETENTION BASIN</text>
  </g>
  <g transform="translate(100, 240)">
    <rect width="300" height="45" rx="3" fill="#0C151B" stroke="#35556B" stroke-width="1"/>
    <text x="14" y="18" font-family="'Geist Mono', monospace" font-size="8" fill="#A3E8BF">SUDS &bull; RAINWATER HARVESTING &bull; RETENTION</text>
    <text x="14" y="32" font-family="'Geist Mono', monospace" font-size="8" fill="#94A3B8">PEAK RUNOFF MITIGATION &amp; URBAN FLOODING RESILIENCE</text>
  </g>
  <path d="M 12 12 H 24 M 12 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 12 H 476 M 488 12 V 24" stroke="#497E5E" stroke-width="2"/>
  <path d="M 12 308 H 24 M 12 308 V 296" stroke="#497E5E" stroke-width="2"/>
  <path d="M 488 308 H 476 M 488 308 V 296" stroke="#497E5E" stroke-width="2"/>
</svg>
